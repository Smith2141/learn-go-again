root = "."
tmp_dir = "tmp"

[build]
# Вместо bin используем entrypoint
entrypoint = ["./tmp/main"]
cmd = "go build -gcflags=\"all=-N -l\" -o ./tmp/main ."
delay = 1000
exclude_dir = ["tmp", "vendor", ".git", ".vscode"]
exclude_file = []
exclude_regex = []
exclude_unchanged = false
follow_symlink = false
full_bin = ""
include_dir = []
include_ext = ["go", "tpl", "tmpl", "html"]
kill_delay = "0s"
log = "build-errors.log"
log_main_only = false
send_interrupt = false
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = false

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
